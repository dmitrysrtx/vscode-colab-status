name: Build and Release Extension

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to VS Code Marketplace / Open VSX (if secrets are configured)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build bundle
        env:
          COLAB_OAUTH_CLIENT_ID: ${{ secrets.COLAB_OAUTH_CLIENT_ID }}
          COLAB_OAUTH_CLIENT_SECRET: ${{ secrets.COLAB_OAUTH_CLIENT_SECRET }}
        run: npm run build

      - name: Package VSIX
        env:
          COLAB_OAUTH_CLIENT_ID: ${{ secrets.COLAB_OAUTH_CLIENT_ID }}
          COLAB_OAUTH_CLIENT_SECRET: ${{ secrets.COLAB_OAUTH_CLIENT_SECRET }}
        run: npx @vscode/vsce package

      - name: Locate VSIX file
        id: vsix
        run: |
          VSIX_FILE=$(ls -1 *.vsix | head -n 1)
          echo "file=${VSIX_FILE}" >> "$GITHUB_OUTPUT"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: colab-gpu-status-vsix
          path: ${{ steps.vsix.outputs.file }}

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.vsix.outputs.file }}
          generate_release_notes: true

      - name: Publish to VS Code Marketplace (Trusted Publishing / OIDC)
        if: >-
          (startsWith(github.ref, 'refs/tags/v') || inputs.publish == true) &&
          secrets.VSCE_PAT == ''
        run: npx @vscode/vsce@latest publish --oidc --packagePath "${{ steps.vsix.outputs.file }}"

      - name: Publish to VS Code Marketplace (PAT fallback)
        if: >-
          (startsWith(github.ref, 'refs/tags/v') || inputs.publish == true) &&
          secrets.VSCE_PAT != ''
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx @vscode/vsce@latest publish --packagePath "${{ steps.vsix.outputs.file }}"

      - name: Publish to Open VSX Registry
        if: >-
          (startsWith(github.ref, 'refs/tags/v') || inputs.publish == true) &&
          secrets.OVSX_PAT != ''
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          npx ovsx create-namespace dmitrysrtx -p "$OVSX_PAT" || true
          npx ovsx publish "${{ steps.vsix.outputs.file }}" -p "$OVSX_PAT"
